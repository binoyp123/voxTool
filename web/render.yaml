# Optional: deploy the Flask API on Render (free tier).
# Vercel hosts the React frontend only; set REACT_APP_API_URL to this service URL.
services:
  - type: web
    name: voxtool-api
    runtime: python
    rootDir: web/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 300 --workers 1 'app:create_app()'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
